name: Bump site submodule

# 主题更新后，把个人站点里的主题子模块指针推到最新提交。
#
# 为什么需要它：站点用 submodule 引用主题，指针不会自己走。没有这个工作流，
# 每次改完主题都得手动去站点仓库提交一次「升级主题」，很容易忘。
#
# 触发后站点仓库会多一个提交（由 sasaOrange 身份推），
# 站点的 deploy 工作流随即重新构建并部署。
#
# 触发方式：等 demo 的部署工作流（Deploy demo to Cloudflare Pages）在 main 上
# 跑完就接上。这样多一道门——demo 构建和五项回归过了才推进站点指针；同时保留
# 了读 SITE_PUSH_TOKEN 的能力（见下面 bump 任务的说明）。手动触发用于补推。
on:
  workflow_run:
    workflows: [Deploy demo to Cloudflare Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 站点只需要跟上最新一次主题提交，旧的排队即可取消。
concurrency:
  group: bump-site
  cancel-in-progress: true

jobs:
  bump:
    name: Point site at latest theme
    runs-on: ubuntu-latest
    # 用 workflow_run 而不是直接 push：GITHUB_TOKEN 触发的运行（包括由它引起
    # 的连锁推送）读不到仓库密钥，直接响应本仓库 push 会以「secret 为空」失败。
    # workflow_run 的起点是另一条工作流，密钥照常可读。
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout theme
        uses: actions/checkout@v4
        with:
          # workflow_run 里默认拿不到触发它的提交，显式取那一次构建的 SHA；
          # 手动触发时退回 main。
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}

      - name: Checkout site
        uses: actions/checkout@v4
        with:
          repository: TruE-aL/sasaOrange-blog-hugo-personalsite
          # 需要一个能写站点仓库的 token。用仓库自带的 GITHUB_TOKEN 不行，
          # 它只对当前仓库有权限；所以这里读 SITE_PUSH_TOKEN（PAT）。
          token: ${{ secrets.SITE_PUSH_TOKEN }}
          path: site

      - name: Move submodule to this commit
        working-directory: site
        env:
          THEME_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          THEME_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 旧站点仍用 themes/ruri，新安装用 themes/sasaOrange。自动识别，
          # 这样目录改名前后都不需要手动改这个工作流。
          has_path() {
            [ -d "$1" ] && return 0
            [ -f .gitmodules ] && grep -q "path = $1" .gitmodules
          }
          if has_path themes/sasaOrange; then
            THEME_DIR=themes/sasaOrange
          elif has_path themes/ruri; then
            THEME_DIR=themes/ruri
          else
            echo "找不到主题子模块目录（themes/sasaOrange 或 themes/ruri）" >&2
            exit 1
          fi
          echo "使用主题目录：$THEME_DIR"

          git submodule update --init "$THEME_DIR"
          git -C "$THEME_DIR" fetch --depth 1 origin "$THEME_SHA"
          git -C "$THEME_DIR" checkout "$THEME_SHA"

          if git diff --quiet -- "$THEME_DIR"; then
            echo "站点已经指向 $THEME_SHA，无需更新。"
            exit 0
          fi

          git config user.name "sasaOrange"
          git config user.email "sasaOrange@users.noreply.github.com"
          git add "$THEME_DIR"
          git commit -m "chore: 升级主题到 ${THEME_SHA:0:7}

          由 ${THEME_REPO} 的 Bump site submodule 工作流自动提交。"
          git push origin HEAD:main
