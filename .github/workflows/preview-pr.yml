name: Preview pull request

# 给 PR 构建一份预览站，并把构建和示例站回归跑一遍。
#
# 预览地址：https://true-al.github.io/sasaOrange-blog-hugo/preview/pr-<编号>/
#
# 这个工作流**只构建、不发布**。发布交给 deploy-pages.yml 的 `publish-preview`
# 任务：github-pages 环境的部署分支策略只放行 main，从这里直接 deploy-pages 会
# 因为分支策略被拒（实测 failure，日志 BlobNotFound）。所以这里把产物上传成
# `github-pages` artifact，由那条跑在 main 上的工作流用 workflow_run 接过去发布。
# 好处是分支策略不用放宽，预览和正式站共用同一条 Pages 链路。
#
# 为什么不把预览作为普通文件提交到 gh-pages 分支：本仓库 Pages 的 build_type 是
# workflow，那条分支不会被服务，预览目录访问一律 404。这一点已实测确认。
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

# 与正式发布共用 pages 组：预览和正式站排队，而不是互相取消。
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.162.1

jobs:
  build:
    name: Build preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 主题就在本仓库根目录，挂成 themes/ruri，和用户「装进 themes/」的用法一致。
      - name: Link theme
        run: |
          mkdir -p exampleSite/themes
          ln -s "$PWD" exampleSite/themes/ruri

      # 和正式发布同一条命令，构建不过就是回归失败，PR 上直接能看到。
      - name: Build example site
        env:
          PR: ${{ github.event.pull_request.number || 0 }}
        run: |
          cd exampleSite
          hugo --gc --minify --themesDir themes \
            --baseURL "https://true-al.github.io/sasaOrange-blog-hugo/preview/pr-${PR}/"

      - name: Build search index
        run: npx -y pagefind@1.4.0 --site exampleSite/public --glob '**/*.html'

      - name: Run theme tests
        run: |
          rm -rf exampleSite/themes
          python3 tests/smoke.py
          python3 tests/features-build.py
          python3 tests/media-build.py
          python3 tests/culture-build.py
          python3 tests/module-build.py

      # 产物名必须是 github-pages、内容是纯 public 目录：deploy-pages 那边要按
      # 这个约定接着发。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public
