name: Preview pull request

# 给 PR 出一份可点开看的预览站，顺便把构建和示例站回归跑一遍。
#
# 预览地址：https://true-al.github.io/sasaOrange-blog-hugo/preview/pr-<编号>/
#
# 和正式演示站共用同一条 Pages 链路（deploy-pages.yml 那套）。官方链路一个仓库
# 同时只有一个线上站点，所以两者不能并存：本工作流发布预览时，正式站会暂时变成
# 这份预览；预览清理后，由 deploy-pages.yml 在下次 main 推送（或手动触发）时把
# 正式站放回去。
#
# 为什么不把预览作为普通文件提交到 gh-pages 分支：本仓库 Pages 的 build_type 是
# workflow，那条分支不会被服务，预览目录访问一律 404。这一点已实测确认。
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

# 与正式发布共用 pages 组：预览和正式站排队，而不是互相取消。
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.162.1

jobs:
  build:
    name: Build preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 主题就在本仓库根目录，挂成 themes/ruri，和用户「装进 themes/」的用法一致。
      - name: Link theme
        run: |
          mkdir -p exampleSite/themes
          ln -s "$PWD" exampleSite/themes/ruri

      # 和正式发布同一条命令，构建不过就是回归失败，PR 上直接能看到。
      - name: Build example site
        env:
          PR: ${{ github.event.pull_request.number || 0 }}
        run: |
          cd exampleSite
          hugo --gc --minify --themesDir themes \
            --baseURL "https://true-al.github.io/sasaOrange-blog-hugo/preview/pr-${PR}/"

      - name: Build search index
        run: npx -y pagefind@1.4.0 --site exampleSite/public --glob '**/*.html'

      - name: Run theme tests
        run: |
          rm -rf exampleSite/themes
          python3 tests/smoke.py
          python3 tests/features-build.py
          python3 tests/media-build.py
          python3 tests/culture-build.py
          python3 tests/module-build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

  deploy:
    name: Publish preview
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment on pull request
        if: github.event.pull_request.number
        uses: actions/github-script@v7
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = Number(process.env.PR);
            const url = `https://${owner.toLowerCase()}.github.io/${repo}/preview/pr-${pr}/`;
            const body = [
              '### 预览已就绪',
              '',
              `- 预览站：${url}`,
              `- 提交：\`${process.env.SHA.slice(0, 7)}\``,
              '',
              '构建 + 五项回归（smoke / features / media / culture / module）全过才会发布。',
              '预览与正式演示站共用同一条 Pages 链路：预览期间根路径看到的也是这份预览，恢复方式见工作流说明。',
            ].join('\n');
            const marker = '<!-- sasaorange-preview -->';
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: marker + '\n' + body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body: marker + '\n' + body });
            }
